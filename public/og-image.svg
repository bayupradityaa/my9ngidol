<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FFEB3B"/>
  <g fill="none" stroke="#000" stroke-width="8">
    <rect x="60" y="60" width="1080" height="510"/>
  </g>
  <!-- 3x3 grid motif -->
  <g transform="translate(120,150)">
    <g stroke="#000" stroke-width="6">
      <rect x="0" y="0" width="90" height="90" fill="#FF5252"/>
      <rect x="105" y="0" width="90" height="90" fill="#2196F3"/>
      <rect x="210" y="0" width="90" height="90" fill="#4ECDC4"/>
      <rect x="0" y="105" width="90" height="90" fill="#2196F3"/>
      <rect x="105" y="105" width="90" height="90" fill="#FFDB58"/>
      <rect x="210" y="105" width="90" height="90" fill="#FF6B6B"/>
      <rect x="0" y="210" width="90" height="90" fill="#4ECDC4"/>
      <rect x="105" y="210" width="90" height="90" fill="#FF5252"/>
      <rect x="210" y="210" width="90" height="90" fill="#2196F3"/>
    </g>
  </g>
  <g transform="translate(520,230)">
    <text x="0" y="0" font-family="Archivo Black, Arial Black, sans-serif" font-size="150" font-weight="900" fill="#000">9oshi</text>
    <text x="6" y="90" font-family="Space Grotesk, Arial, sans-serif" font-size="44" font-weight="700" fill="#000">Your Oshi. Your Story.</text>
    <text x="6" y="150" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="500" fill="#000">Pick 9 JKT48 members. Share your formation.</text>
  </g>
</svg>
